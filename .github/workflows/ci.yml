name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Linux (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build patchelf dpkg-dev file desktop-file-utils \
            libopencv-dev libglfw3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            python3

      - name: ONNX Runtime (CPU)
        env:
          ORT_FLAVOR: cpu
        run: scripts/fetch_deps.sh

      - name: Build core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j "$(nproc)"

      - name: Build GUI
        run: |
          cmake -S gui-native -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j "$(nproc)"

      - name: Cache AppImage tools
        uses: actions/cache@v4
        with:
          path: .cache/appimage-tools
          key: appimage-tools-${{ runner.os }}-v1

      # Build the distributable packages on every push so packaging breakage is
      # caught long before a tag is pushed. Nothing is published here.
      - name: Build packages
        env:
          VERSION: 0.0.0-ci
        run: |
          bash packaging/linux/build_portable.sh "$VERSION"
          bash packaging/linux/build_deb.sh "$VERSION"
          bash packaging/linux/build_appimage.sh "$VERSION"

      - name: Smoke-test packages
        run: |
          test -f dist/faceforge-0.0.0-ci-linux-x64.tar.gz
          test -f dist/faceforge_0.0.0-ci_amd64.deb
          test -f dist/faceforge-0.0.0-ci-x86_64.AppImage
          tar tzf dist/faceforge-0.0.0-ci-linux-x64.tar.gz | grep -q bin/faceforge-gui
          dpkg-deb --info dist/faceforge_0.0.0-ci_amd64.deb > /dev/null
          dpkg-deb --contents dist/faceforge_0.0.0-ci_amd64.deb | grep -q usr/bin/faceforge-gui

      - name: Smoke test
        run: |
          ./build/ffbench --help > /dev/null
          test -x build-native/faceforge-gui
          test -f build/libfaceforge.so

  windows:
    name: Windows (CPU)
    runs-on: windows-2022
    env:
      # Prebuilt OpenCV keeps the Windows job fast and deterministic. Developers
      # who prefer vcpkg can omit OpenCV_DIR and set VCPKG_ROOT instead.
      OpenCV_DIR: C:\opencv\build
    steps:
      - uses: actions/checkout@v4

      - name: OpenCV 4.14 (prebuilt)
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-windows.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\opencv.exe"
          # The self-extracting archive already contains an `opencv\` folder, so
          # extract to C:\ to get C:\opencv\build\OpenCVConfig.cmake.
          7z x "$env:RUNNER_TEMP\opencv.exe" -oC:\ -y | Out-Null
          if (-not (Test-Path "C:\opencv\build\OpenCVConfig.cmake")) {
            throw "OpenCV extraction failed"
          }

      - name: ONNX Runtime (CPU)
        shell: pwsh
        run: .\scripts\fetch_deps.ps1 -Flavor cpu

      - name: Build core
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR="$env:OpenCV_DIR"
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Build GUI
        shell: pwsh
        run: |
          cmake -S gui-native -B build-native
          cmake --build build-native --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup compiler not found"
          }

      # Build the distributable packages on every push; nothing is published.
      - name: Build packages
        shell: pwsh
        env:
          VERSION: 0.0.0-ci
        run: |
          .\packaging\windows\build_portable.ps1 -Version $env:VERSION
          .\packaging\windows\build_installer.ps1 -Version $env:VERSION -Iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Smoke-test packages
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\faceforge-0.0.0-ci-windows-x64.zip")) { throw "portable zip missing" }
          if (-not (Test-Path "dist\faceforge-0.0.0-ci-windows-x64-setup.exe")) { throw "installer missing" }

      - name: Smoke test
        shell: pwsh
        run: |
          .\build\ffbench.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ffbench --help failed" }
          if (-not (Test-Path .\build-native\faceforge-gui.exe)) { throw "GUI missing" }
          if (-not (Test-Path .\build-native\faceforge.dll)) { throw "core DLL missing" }
          if (-not (Test-Path .\build-native\onnxruntime.dll)) { throw "onnxruntime.dll not bundled" }
          Get-ChildItem .\build-native\opencv_*.dll